<svg width="100%" viewBox="0 0 680 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Feynman quote banner, soothing animation</title><desc>Dark banner with Feynman's first principle quote; a comet drifts from scattered dots into a breathing target, shifting from slate to rose as it travels.</desc>
<defs>
<pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#151c28"/></pattern>
<path id="journey" d="M94 204 L114 212 L132 199 L150 214 L168 205 L186 197 L204 212 L222 202 L248 210 L288 200 L328 208 L368 201 L408 206 L560 206 L594 206"/>
</defs>
<rect x="1" y="1" width="678" height="238" rx="12" fill="#0d1117" stroke="#262d38" stroke-width="1"/>
<rect x="1" y="1" width="678" height="238" rx="12" fill="url(#dotgrid)"/>
<g stroke="#f0a3bc" stroke-width="1" opacity=".55" fill="none">
<path d="M26 46 L26 26 L46 26" stroke-dasharray="40" stroke-dashoffset="40"><animate attributeName="stroke-dashoffset" values="40;0" begin="0s" dur="0.8s" fill="freeze"/></path>
<path d="M654 194 L654 214 L634 214" stroke-dasharray="40" stroke-dashoffset="40"><animate attributeName="stroke-dashoffset" values="40;0" begin="0.2s" dur="0.8s" fill="freeze"/></path>
</g>
<text x="40" y="132" font-family="Georgia,'Times New Roman',serif" font-size="130" fill="#1c222f" opacity="0">&#8220;<animate attributeName="opacity" values="0;1" begin="0.2s" dur="1.2s" fill="freeze"/></text>
<text x="92" y="58" font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11" letter-spacing="3.5" fill="#586275" opacity="0">THE FIRST PRINCIPLE<animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.8s" fill="freeze"/></text>
<line x1="322" y1="54" x2="322" y2="54" stroke="#2a3245" stroke-width="1"><animate attributeName="x2" values="322;374" begin="0.5s" dur="0.8s" calcMode="spline" keySplines=".2 0 .2 1" fill="freeze"/></line>
<g opacity="0">
<text x="92" y="96" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#e9edf5" letter-spacing=".3">The first principle is that you must not fool yourself &#8212;</text>
<animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.9s" dur="1.3s" calcMode="spline" keySplines=".2 0 .2 1" fill="freeze"/>
<animate attributeName="opacity" values="0;1" begin="0.9s" dur="1.3s" fill="freeze"/>
</g>
<g opacity="0">
<text x="92" y="126" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#e9edf5" letter-spacing=".3">and you are <tspan fill="#f4afc6">the easiest person to fool</tspan>.</text>
<animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="1.7s" dur="1.3s" calcMode="spline" keySplines=".2 0 .2 1" fill="freeze"/>
<animate attributeName="opacity" values="0;1" begin="1.7s" dur="1.3s" fill="freeze"/>
</g>
<rect x="438" y="112" width="1.5" height="15" fill="#f0a3bc" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.35;.65;1" begin="3.3s" dur="1.6s" repeatCount="indefinite"/></rect>
<g opacity="0">
<g font-family="-apple-system,'Segoe UI',Inter,sans-serif" font-size="11.5" letter-spacing="2.5"><text x="92" y="163" fill="#f0a3bc">&#8212;</text><text x="112" y="163" fill="#8b95a7">RICHARD P. FEYNMAN</text></g>
<animateTransform attributeName="transform" type="translate" values="0 8;0 0" begin="2.7s" dur="1.2s" calcMode="spline" keySplines=".2 0 .2 1" fill="freeze"/>
<animate attributeName="opacity" values="0;1" begin="2.7s" dur="1.2s" fill="freeze"/>
</g>
<g fill="#39445c">
<circle cx="94" cy="204" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.4s" fill="freeze"/><animate attributeName="cy" values="204;200;204" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="114" cy="212" r="1.1" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.4s" fill="freeze"/><animate attributeName="cx" values="114;117;114" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="132" cy="199" r="1.4" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze"/><animate attributeName="cy" values="199;203;199" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="214" r="1.1" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.4s" fill="freeze"/><animate attributeName="cy" values="214;211;214" dur="8.5s" repeatCount="indefinite"/></circle>
<circle cx="168" cy="205" r="1.4" opacity="0"><animate attributeName="opacity" values="0;1" begin="1s" dur="0.4s" fill="freeze"/><animate attributeName="cx" values="168;165;168" dur="13s" repeatCount="indefinite"/></circle>
<circle cx="186" cy="197" r="1.2" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.4s" fill="freeze"/><animate attributeName="cy" values="197;201;197" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="204" cy="212" r="1.3" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/><animate attributeName="cy" values="212;209;212" dur="9.5s" repeatCount="indefinite"/></circle>
<circle cx="222" cy="202" r="1.4" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.4s" fill="freeze"/><animate attributeName="cx" values="222;225;222" dur="10.5s" repeatCount="indefinite"/></circle>
</g>
<path d="M248 210 L288 200 L328 208 L368 201 L408 206" fill="none" stroke="#4a5a7a" stroke-width=".8" stroke-dasharray="230" stroke-dashoffset="230"><animate attributeName="stroke-dashoffset" values="230;0" begin="1.6s" dur="1.4s" fill="freeze"/></path>
<g fill="#5f6f8f" opacity="0">
<circle cx="288" cy="200" r="1.6"/><circle cx="328" cy="208" r="1.6"/><circle cx="368" cy="201" r="1.6"/>
<animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/>
</g>
<line x1="424" y1="206" x2="560" y2="206" stroke="#2a3245" stroke-width=".7" stroke-dasharray="1 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.6s" fill="freeze"/><animate attributeName="stroke-dashoffset" values="0;-12" dur="2.8s" repeatCount="indefinite"/></line>
<circle cx="596" cy="206" r="14" fill="none" stroke="#93a3c0" stroke-width=".8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0" begin="3s" dur="0.9s" fill="freeze"/><animate attributeName="r" values="14;15.2;14" begin="4.2s" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="596" cy="206" r="8" fill="none" stroke="#93a3c0" stroke-width=".8" opacity=".7" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0" begin="3.2s" dur="0.8s" fill="freeze"/></circle>
<circle cx="596" cy="206" r="0" fill="#f0a3bc"><animate attributeName="r" values="0;3.6;2.6" keyTimes="0;.7;1" begin="3.8s" dur="0.5s" fill="freeze"/></circle>
<circle r="4.5" fill="#f0a3bc" opacity="0"><animateMotion begin="5s" dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.38;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1"><mpath href="#journey"/></animateMotion><animate attributeName="opacity" values="0;.13;.13;0;0" keyTimes="0;.015;.355;.395;1" begin="5s" dur="12s" repeatCount="indefinite"/></circle>
<circle r="2" opacity="0"><animateMotion begin="5s" dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.38;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1"><mpath href="#journey"/></animateMotion><animate attributeName="fill" values="#9aa7bb;#f0a3bc;#f0a3bc" keyTimes="0;.38;1" begin="5s" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0;0" keyTimes="0;.015;.355;.395;1" begin="5s" dur="12s" repeatCount="indefinite"/></circle>
<circle r="1.2" fill="#f0a3bc" opacity="0"><animateMotion begin="5.18s" dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.38;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1"><mpath href="#journey"/></animateMotion><animate attributeName="opacity" values="0;.4;.4;0;0" keyTimes="0;.015;.355;.395;1" begin="5.18s" dur="12s" repeatCount="indefinite"/></circle>
<circle r="0.7" fill="#f0a3bc" opacity="0"><animateMotion begin="5.36s" dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.38;1" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1"><mpath href="#journey"/></animateMotion><animate attributeName="opacity" values="0;.22;.22;0;0" keyTimes="0;.015;.355;.395;1" begin="5.36s" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="596" cy="206" r="14" fill="none" stroke="#f0a3bc" stroke-width=".8" opacity="0"><animate attributeName="r" values="14;26;26" keyTimes="0;.12;1" begin="9.56s" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".38;0;0" keyTimes="0;.12;1" begin="9.56s" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="596" cy="206" r="14" fill="none" stroke="#f0a3bc" stroke-width=".6" opacity="0"><animate attributeName="r" values="14;22;22" keyTimes="0;.1;1" begin="9.86s" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".26;0;0" keyTimes="0;.1;1" begin="9.86s" dur="12s" repeatCount="indefinite"/></circle>
</svg>
